<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <style>
    .lbl{font-size:22px;fill:#222;font-weight:700}
    .sub{font-size:17px;fill:#666}
    .task{font-size:20px;fill:#1a3d7c;font-weight:700}
    .box{fill:#eef4ff;stroke:#5b8def;stroke-width:2;rx:10}
    .mem{fill:#fff3d6;stroke:#e0a83a;stroke-width:2;rx:10}
    .cur{fill:#e8f7ec;stroke:#3aa65b;stroke-width:2;rx:10}
    .c0{fill:#f2f2f2;stroke:#999;stroke-width:2;rx:10}
    .ln{stroke:#555;stroke-width:2;fill:none;marker-end:url(#a)}
    .memln{stroke:#e0a83a;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <!-- C0 -->
  <rect x="30" y="200" width="150" height="120" class="c0"/>
  <text x="105" y="245" text-anchor="middle" class="lbl">C0</text>
  <text x="105" y="272" text-anchor="middle" class="sub">19 фактов</text>
  <text x="105" y="294" text-anchor="middle" class="sub">read-only</text>

  <!-- row labels -->
  <text x="240" y="70" class="lbl">memory-off</text>
  <text x="240" y="95" class="sub">чистая сессия на каждую задачу</text>
  <text x="240" y="225" class="lbl">memory-on</text>
  <text x="240" y="250" class="sub">read → task → validated write, xmemory child на сессию</text>
  <text x="240" y="385" class="lbl">memory-on + evolve</text>
  <text x="240" y="410" class="sub">тот же поток + curator-session без доступа к коду</text>

  <!-- off row -->
  <g>
    <rect x="600" y="40" width="80" height="60" class="box"/><text x="640" y="78" text-anchor="middle" class="task">a1</text>
    <rect x="720" y="40" width="80" height="60" class="box"/><text x="760" y="78" text-anchor="middle" class="task">a2</text>
    <rect x="840" y="40" width="80" height="60" class="box"/><text x="880" y="78" text-anchor="middle" class="task">a3</text>
    <rect x="1000" y="40" width="80" height="60" class="box"/><text x="1040" y="78" text-anchor="middle" class="task">a4</text>
    <rect x="1120" y="40" width="80" height="60" class="box"/><text x="1160" y="78" text-anchor="middle" class="task">a5</text>
    <rect x="1240" y="40" width="80" height="60" class="box"/><text x="1280" y="78" text-anchor="middle" class="task">a6</text>
  </g>
  <!-- on row -->
  <g>
    <path d="M180 260 C 400 260, 450 200, 600 200" class="memln"/>
    <rect x="600" y="170" width="80" height="60" class="box"/><text x="640" y="208" text-anchor="middle" class="task">a1</text>
    <path d="M680 200 L720 200" class="memln"/>
    <rect x="720" y="170" width="80" height="60" class="box"/><text x="760" y="208" text-anchor="middle" class="task">a2</text>
    <path d="M800 200 L840 200" class="memln"/>
    <rect x="840" y="170" width="80" height="60" class="box"/><text x="880" y="208" text-anchor="middle" class="task">a3</text>
    <path d="M920 200 L1000 200" class="memln"/>
    <rect x="1000" y="170" width="80" height="60" class="box"/><text x="1040" y="208" text-anchor="middle" class="task">a4</text>
    <path d="M1080 200 L1120 200" class="memln"/>
    <rect x="1120" y="170" width="80" height="60" class="box"/><text x="1160" y="208" text-anchor="middle" class="task">a5</text>
    <path d="M1200 200 L1240 200" class="memln"/>
    <rect x="1240" y="170" width="80" height="60" class="box"/><text x="1280" y="208" text-anchor="middle" class="task">a6</text>
  </g>
  <!-- evolve row -->
  <g>
    <path d="M180 270 C 400 270, 450 360, 600 360" class="memln"/>
    <rect x="600" y="330" width="80" height="60" class="box"/><text x="640" y="368" text-anchor="middle" class="task">a1</text>
    <path d="M680 360 L720 360" class="memln"/>
    <rect x="720" y="330" width="80" height="60" class="box"/><text x="760" y="368" text-anchor="middle" class="task">a2</text>
    <path d="M800 360 L840 360" class="memln"/>
    <rect x="840" y="330" width="80" height="60" class="box"/><text x="880" y="368" text-anchor="middle" class="task">a3</text>
    <path d="M920 360 L935 360" class="memln"/>
    <rect x="935" y="322" width="50" height="76" class="cur"/><text x="960" y="356" text-anchor="middle" font-size="14" fill="#1f6b36" font-weight="700">cura</text><text x="960" y="374" text-anchor="middle" font-size="14" fill="#1f6b36" font-weight="700">tor</text>
    <path d="M985 360 L1000 360" class="memln"/>
    <rect x="1000" y="330" width="80" height="60" class="box"/><text x="1040" y="368" text-anchor="middle" class="task">a4</text>
    <path d="M1080 360 L1120 360" class="memln"/>
    <rect x="1120" y="330" width="80" height="60" class="box"/><text x="1160" y="368" text-anchor="middle" class="task">a5</text>
    <path d="M1200 360 L1240 360" class="memln"/>
    <rect x="1240" y="330" width="80" height="60" class="box"/><text x="1280" y="368" text-anchor="middle" class="task">a6</text>
  </g>
  <!-- legend -->
  <line x1="600" y1="470" x2="660" y2="470" class="memln"/>
  <text x="675" y="476" class="sub">memory state едет по цепочке через xmemory (clone → read → write)</text>
  <rect x="600" y="490" width="30" height="20" class="box"/>
  <text x="640" y="506" class="sub">задача = новая coding-сессия, одноразовый workspace на base-коммите реального PR, hidden tests из эталонного PR</text>
</svg>
