<h2 id="%D0%B3%D0%B8%D0%BF%D0%BE%D1%82%D0%B5%D0%B7%D0%B0-%D0%BC%D0%B5%D0%BD%D1%8C%D1%88%D0%B5-%D1%80%D0%B0%D0%B7%D0%B1%D0%B8%D1%80%D0%B0%D1%82%D1%8C%D1%81%D1%8F-%D0%B7%D0%B0%D0%BD%D0%BE%D0%B2%D0%BE">Гипотеза: меньше разбираться заново</h2>
<p>Каждая новая сессия снова изучает проект.<br />Мы решили сохранить найденные правила и передавать их агенту.</p>
<div class="columns">
<div>
<p><strong>Например, задача</strong></p>
<p>Исправить поиск рецептов:<br />слова с дефисами не находятся.</p>
</div>
<div>
<p><strong>Что уже знает память</strong></p>
<p>Нормализованные поля вычисляются автоматически. Изменения требуют миграции данных.</p>
</div>
</div>
<p class="takeaway">Ожидание: агент быстрее найдёт нужное место<br />и учтёт ограничения проекта.</p>
<p class="source">Реальный пример: задача a1 и факты do-0005/0006 из <a href="https://github.com/podlodka-ai-club/kata/blob/39d495b3329b355fbd2c54f97bea0dded15ca5c9/dataset/facts/snapshot-c0.md">стартовой памяти Mealie</a>.</p>

<h2 id="%D0%BF%D0%B0%D0%BC%D1%8F%D1%82%D1%8C-%D0%BC%D0%B5%D0%B6%D0%B4%D1%83-%D0%B7%D0%B0%D0%B4%D0%B0%D1%87%D0%B0%D0%BC%D0%B8">Память между задачами</h2>
<p><strong>В xmemory:</strong> типы фактов, сущности и связи между ними.<br />У факта есть источник в коде, статус и степень уверенности.</p>
<ol>
<li>Перед задачей агент получает подходящие факты.</li>
<li>После правок обновляет память и сохраняет новые наблюдения.</li>
<li>Между задачами отдельная сессия убирает дубли<br />и помечает устаревшие записи.</li>
</ol>
<p class="takeaway">Для Mealie начали с <strong>19 фактов</strong>: API, ограничения,<br />владение данными и настройки.</p>
<p class="source">Схема под задачу и чтение после записи входят в основной сценарий. <a href="https://github.com/podlodka-ai-club/kata/blob/2f82aca3bd0f3bb96c2b39953686adb7df9081d5/dataset/runner/README.md">Протокол и раннер</a>.</p>
</section>

<h2 id="%D0%BA%D0%B0%D0%BA-%D0%BF%D1%80%D0%BE%D0%B2%D0%B5%D1%80%D1%8F%D0%BB%D0%B8-%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D1%83">Как проверяли пользу</h2>
<p><strong>Mealie, 6 реальных задач:</strong> от исправления поиска<br />до входа через OIDC. Claude Sonnet 5, effort medium.</p>
<table>
<thead>
<tr>
<th>Режим</th>
<th>Что получает агент</th>
</tr>
</thead>
<tbody>
<tr>
<td>Без памяти</td>
<td>Код и постановку задачи</td>
</tr>
<tr>
<td>С памятью</td>
<td>Ещё и факты, которые обновляет после работы</td>
</tr>
<tr>
<td>С пересмотром памяти</td>
<td>То же + отдельную сессию ревизии фактов</td>
</tr>
</tbody>
