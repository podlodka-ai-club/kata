# Скопировать в config.toml и поправить под себя.
# Провайдер и лимиты живут здесь, а не в коде: каждый жжёт свои токены.

[repo]
url = "https://github.com/mealie-recipes/mealie.git"
clone = ".cache/mealie"                 # reference clone; агент его историю не получает
fetch = false                            # pinned commits already present; no network during eval

# mealie везёт собственные агентские файлы. Если их не убрать, memory-off
# на самом деле «с чужой памятью» и вся дельта схлопнется.
strip_files = ["AGENTS.md", "CLAUDE.md"]

# Окружение для ВСЕХ команд репозитория (setup, тесты, агент).
# UV_FROZEN обязателен: в pyproject у mealie скользящее окно exclude-newer,
# без этого uv на каждый вызов переразрешает лок и падает на пинах внутри окна.
env = { UV_FROZEN = "1" }

setup_cmd = "uv sync --python python3.12"
test_cmd = "uv run pytest"
regression_scope = "tests/unit_tests"   # на чём ловим «починил своё, сломал чужое»
test_timeout_sec = 1800

[agent]
# kind: claude | codex | null | oracle
#   null   — ничего не делает: скрытые тесты ОБЯЗАНЫ упасть
#   oracle — накатывает исходники эталонного PR (без тестов): ОБЯЗАНЫ пройти
# Эти два прогоняются первыми и проверяют не модель, а сам каркас.
kind = "claude"
# Полный pinned model id, не короткий алиас sonnet/opus/haiku. Начиная с
# поколения 4.6 dateless API ids тоже являются неизменяемыми snapshots.
model = "claude-sonnet-5"
effort = "medium"
# Под -p спросить о правах не у кого: dontAsk жёстко отклоняет всё, что не
# разрешено ниже. --tools убирает из контекста агента Web/MCP/subagent-инструменты,
# а project settings добавляют OS sandbox вокруг Bash-процессов.
cmd = [
  "claude", "-p", "{prompt}",
  "--model", "{model}",
  "--effort", "{effort}",
  "--output-format", "json",
  "--permission-mode", "dontAsk",
  "--tools", "Read,Glob,Grep,Edit,Write,Bash",
  "--allowedTools", "Read(./**),Glob,Grep,Edit(./**),Write,Bash(uv run pytest *),Bash(git status *),Bash(git diff *)",
  "--setting-sources", "project",
  "--strict-mcp-config",
  "--mcp-config", '{"mcpServers":{}}',
  "--disable-slash-commands",
  "--no-session-persistence",
  "--no-chrome",
]
timeout_sec = 3600
transient_retries = 1

[memory]
# Hackathon path: xmemory is the only state carried between sessions. File remains
# available only for free selftests/local debugging and is always fallback=true.
backend = "xmemory"                    # xmemory | file
require_xmemory_for_memory_modes = true
snapshot = "dataset/facts/snapshot-c0.md"
retrieval = "task-slices"
top_k = 20
xmemcli = "xmemcli"
instance_name_prefix = "kata"

# Ephemeral research retention: keep the immutable C0 template, but delete only
# runner-owned parents after a verified clone and the final child after each stream.
# Local lineage retains remote IDs, hashes, and deletion receipts for audit.
delete_parent_after_clone = true
delete_stream_tail = true

# Provision once with provision_xmemory.py. This template is never mutated. Each
# coding/curator session auto-creates a fresh child from the previous cloud instance.
c0_instance_id = "<c0-template-instance-id>"

# Required in both memory-on streams. Coding usage and memory read/write usage are logged separately.
write_back = true
