     judge_hint: "инвалидация через колонку в модели пользователя и миграцию, а не через список в памяти процесса"}
  - {commit: 48752bcd0, date: 2026-05-31, title: "CSV/TXT импорт и валидация миграции Plan to Eat",
     slices: [module-graph, api-contracts]}
  - {commit: feadec690, date: 2026-08-24, title: "cookiefile для yt-dlp",
     slices: [config-flags, external-integrations]}
  - {commit: 1cebfd56a, date: 2026-05-14, title: "Локаль в событии таймлайна рецепта",
     slices: [event-graph, invariants]}

