# Задачи эвала. Целевой репозиторий и реперная точка — repo.md, методика отбора — METHOD-NOTES.md.
#
# Все задачи провалидированы прогоном каркаса (`sweep.py --selftest`):
# null-агент даёт красные скрытые тесты, oracle-агент — зелёные.
#
# Раскладку «одна задача — один файл» из dataset/README.md можно сделать
# механически; здесь всё в одном месте ради ревью.

meta:
  repo: https://github.com/mealie-recipes/mealie.git
  c0: 551a92a03                 # реперная точка: память строится здесь
  # Удаляются в ОБОИХ режимах: в memory-off иначе сравниваем не с пустотой,
  # а с чужой памятью; в memory-on приехали бы две памяти сразу.
  strip_files: [AGENTS.md, CLAUDE.md]
  repeats: 2

# ---------------------------------------------------------------------------
# Про поле contract.
#
# Скрытые тесты эталонного PR пиняют имена, которые этот PR придумал: env-переменную,
# поле схемы, маршрут. Угадать их нельзя ни с памятью, ни без — это лотерея, а не
# архитектурное знание. Поэтому публичный контракт называем прямо в постановке.
#
# Граница простая: в contract идут ИМЕНА (что снаружи), но не АРХИТЕКТУРА (где внутри
# и по какой конвенции). Сказать «маршрут /api/auth/oauth/native/token» можно; сказать
# «положи это в mealie/pkgs/safehttp» нельзя — это ровно тот факт, который мы проверяем.
# Задачи, где контракт неотделим от архитектуры, живут в class_b_pool.
# ---------------------------------------------------------------------------

tasks:

  - id: a1
    transfer_cluster: data-repository-invariants
    solution_commit: d340fdd9d
    base_commit: 551a92a03
    date: 2026-05-10
    title: "Нормализация строк при записи расходится с нормализацией поиска"
    prompt: >
      Рецепты с дефисами и диакритикой не находятся поиском: строки нормализуются
      по-разному при сохранении и при разборе поискового запроса. Приведи их
      к одному поведению, включая уже сохранённые записи.
    hidden_tests:
      - tests/unit_tests/repository_tests/test_search.py
      - tests/unit_tests/services_tests/backup_v2_tests/test_backup_v2.py
    slices: [data-ownership, invariants]
    expected_facts: [fact:do-0005, fact:do-0006]
    grading: {null_passed: 15, oracle_passed: 21}
    architecture:
      required_path_groups:
        - ['^mealie/alembic/versions/']
        - ['^mealie/db/models/', '^mealie/schema/response/query_search\.py$']
      forbidden: []
    contract: null      # имена не пиняются, чистая проверка поведения
    hypothesis: >
      Правило нормализации живёт в одном месте и обязано быть зеркально повторено
      на стороне поиска, а изменение требует миграции для пересчёта сохранённых
      значений. Без памяти агент правит одну сторону и забывает миграцию.

  - id: a2
    transfer_cluster: config-api-auth
    solution_commit: 2d8b74282
    base_commit: 48752bcd0
    date: 2026-05-31
    title: "Пользовательский контент рецепта исполняется в домене приложения"
    prompt: >
      Две дыры сразу. Загруженные ассеты рецепта отдаются браузеру так, что их
      содержимое исполняется в домене приложения. И в описании рецепта можно
      встроить iframe с произвольного хоста. Закрой обе, оставив рабочими
      встраивания с доверенных видеохостингов.
    contract: >
      Список доверенных хостов для iframe читается из переменной окружения
      ALLOWED_IFRAME_HOSTS (значения через запятую, пробелы и пустые элементы
      отбрасываются) и доступен в настройках как allowed_iframe_hosts.
      Дефолты непусты и включают youtube.com и vimeo.com.
    hidden_tests:
      - tests/integration_tests/user_recipe_tests/test_recipe_image_assets.py
      - tests/unit_tests/test_config.py
    slices: [api-contracts, config-flags, invariants]
    expected_facts: [fact:cf-0001, fact:cf-0005, fact:cf-0006]
    grading: {null_passed: 41, oracle_passed: 44}
    architecture:
      required_path_groups:
        - ['^mealie/core/settings/']
        - ['^mealie/routes/media/']
        - ['^frontend/app/lib/sanitize/', '^frontend/app/components/global/SafeMarkdown\.vue$']
        - ['^docs/docs/documentation/getting-started/installation/backend-config\.md$']
      forbidden: []
    hypothesis: >
      Конвенция репозитория: к новой настройке — тест в tests/unit_tests/test_config.py
      и строка в docs/.../backend-config.md. Оба шага забываются без памяти.

  - id: a3
    transfer_cluster: data-repository-invariants
    solution_commit: bda2f3637
    base_commit: 95277e0e6
    date: 2026-07-17
    title: "Нарушение уникальности отдаётся как 500"
    prompt: >
      При попытке создать организатор или метку с уже занятым именем API отвечает
      500. Ответ должен соответствовать смыслу ошибки.
    hidden_tests:
      - tests/integration_tests/category_tag_tool_tests/test_organizers_common.py
      - tests/integration_tests/user_household_tests/test_shopping_list_labels.py
    slices: [api-contracts, invariants]
    expected_facts: [fact:ac-0004]
    grading: {null_passed: 23, oracle_passed: 27}
    architecture:
      required_path_groups:
        - ['^mealie/core/exceptions\.py$']
        - ['^mealie/routes/_base/mixins\.py$']
      forbidden:
        - name: per-controller IntegrityError shortcut
          path_regex: '^mealie/routes/(organizers|households)/'
    contract: null      # имена не пиняются
    hypothesis: >
      Самая чистая задача сета: два изменённых файла. Чтобы попасть, надо знать
      конвенцию регистрации исключений и то, что маппинг ошибок делается
      централизованно в миксине, а не try/except в каждом контроллере.

  - id: a4
    transfer_cluster: config-api-auth
    solution_commit: 29897e35e
    base_commit: 66afe5b4d
    date: 2026-08-09
    title: "Мобильным и десктопным клиентам негде завершить OIDC-логин"
    prompt: >
      OIDC-вход рассчитан на браузерный редирект и не подходит нативным клиентам.
      Добавь серверную часть, через которую нативный клиент получает параметры
      провайдера и обменивает код на сессию, с корректной обработкой
      отклонённого кода.
    contract: >
      Два маршрута: GET /api/auth/oauth/native/config отдаёт параметры провайдера,
      POST /api/auth/oauth/native/token обменивает код на сессию.
    hidden_tests:
      - tests/integration_tests/user_tests/test_oidc_native.py
      - tests/utils/api_routes/__init__.py    # хелпер с константами маршрутов, без него тест не соберётся
    slices: [api-contracts, invariants]
    expected_facts: [fact:ac-0001, fact:ac-0002, fact:iv-0001]
    grading: {null_passed: 0, oracle_passed: 5}
    architecture:
      required_path_groups:
        - ['^mealie/routes/auth/']
        - ['^mealie/schema/user/']
      forbidden: []
    hypothesis: >
      Ошибиться легко в инвариантах: какой код возврата на отклонённый код
      провайдера, что можно и чего нельзя отдавать наружу неаутентифицированному
      клиенту.

  - id: a5
    transfer_cluster: config-api-auth
    solution_commit: feaa1c73a
    base_commit: 17951bb0f
    date: 2026-08-20
    title: "В админской сводке не видно, какие способы входа отключены целиком"
    prompt: >
      Админская сводка о приложении показывает готовность способов входа, но по ней
      нельзя понять, отключён ли способ целиком или просто недонастроен. Разведи
      эти два состояния.
    contract: >
      В ответе сводки появляются поля ldapDisabled и oidcDisabled, равные
      отрицанию соответствующих флагов включения способа входа.
    hidden_tests:
      - tests/integration_tests/admin_tests/test_admin_about.py
    slices: [api-contracts, config-flags]
    expected_facts: [fact:cf-0001, fact:cf-0003, fact:cf-0004]
    grading: {null_passed: 4, oracle_passed: 5}
    architecture:
      required_path_groups:
        - ['^mealie/routes/admin/admin_about\.py$']
        - ['^mealie/schema/admin/about\.py$']
      forbidden: []
    hypothesis: >
      Новых настроек задача не вводит — флаги уже есть. Проверяется знание того,
      где живёт схема сводки и как в неё добавляются производные поля.

  - id: a6
    transfer_cluster: data-repository-invariants
    solution_commit: e3cf55b93
    base_commit: 378a9b072
    date: 2026-08-25
    title: "У категорий и тегов нет счётчика рецептов, дубликаты нельзя объединить"
    prompt: >
      В списках категорий и тегов не хватает количества связанных рецептов,
      а образовавшиеся дубликаты организаторов нечем объединить.
    contract: >
      В выдаче организаторов появляется поле recipeCount. Слияние — отдельные
      эндпоинты .../merge для категорий и для тегов.
    hidden_tests:
      - tests/integration_tests/category_tag_tool_tests/test_organizers_merge.py
    slices: [data-ownership, api-contracts]
    expected_facts: [fact:do-0001, fact:do-0002, fact:do-0003, fact:ac-0002]
    grading: {null_passed: 0, oracle_passed: 9}
    architecture:
      required_path_groups:
        - ['^mealie/db/models/recipe/(category|tag)\.py$']
        - ['^mealie/repos/repository_factory\.py$']
        - ['^mealie/routes/organizers/controller_(categories|tags)\.py$']
        - ['^mealie/schema/recipe/']
      forbidden:
        - name: unscoped repository construction
          path_regex: '^$'
          diff_regex: 'AllRepositories\(\s*\)'
    hypothesis: >
      Семь файлов через все слои, включая фабрику репозиториев. Нужно знать
      конвенцию контроллеров и то, как репозитории скоупятся по группе и household.

# ---------------------------------------------------------------------------
# КЛАСС B — расширение. Здесь контракт неотделим от архитектуры: чтобы скрытый
# тест собрался, пришлось бы написать «положи это в mealie/pkgs/safehttp» — то есть
# раскрыть проверяемый факт. Поэтому тесты эталонного PR как hidden-test не годятся,
# проверки пишем как grep + llm-judge по эталонному диффу (evals/README.md).
# Раннер эти задачи не читает: load_tasks берёт только ключ tasks.
# ---------------------------------------------------------------------------

class_b_pool:
  - {commit: 17398941e, date: 2026-07-26, title: "Устойчивость скрапера, прокси и FlareSolverr",
     slices: [external-integrations, config-flags],
     judge_hint: "расширен централизованный HTTP-слой в mealie/pkgs, а не написан свой клиент в services/scraper"}
  - {commit: 642c826f2, date: 2026-05-21, title: "Фильтр-API отдаёт чувствительные колонки",
     slices: [data-ownership, invariants],
     judge_hint: "список фильтруемых колонок объявлен явно и единообразно во всех моделях"}
